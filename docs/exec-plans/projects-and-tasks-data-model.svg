<svg xmlns="http://www.w3.org/2000/svg" class="d1" viewBox="0 0 1120 600" width="1120" height="600">
<defs>
  <marker id="ab" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3b82f6"/></marker>
  <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#22c55e"/></marker>
  <marker id="ay" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eab308"/></marker>
  <marker id="ap" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#8b5cf6"/></marker>
</defs>
<style>
  :root, svg {
    --dg-bg:#ffffff; --dg-panel:#ffffff; --dg-stroke:#dbe1ea;
    --dg-t1:#1a1d26; --dg-t2:#56607a; --dg-t3:#9aa4b4;
    --dg-blue-fill:#eef5ff; --dg-green-fill:#ecfdf5; --dg-amber-fill:#fefce8; --dg-purple-fill:#f4f0ff;
    --dg-tx-blue:#2563eb; --dg-tx-green:#16a34a; --dg-tx-purple:#7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root, svg {
      --dg-bg:#0b0b14; --dg-panel:#0f1420; --dg-stroke:#1e2736;
      --dg-t1:#e6e9f0; --dg-t2:#8b96a8; --dg-t3:#5a6478;
      --dg-blue-fill:#162036; --dg-green-fill:#0c1a12; --dg-amber-fill:#1c1a08; --dg-purple-fill:#1a1530;
      --dg-tx-blue:#93c5fd; --dg-tx-green:#22c55e; --dg-tx-purple:#c4b5fd;
    }
  }
  .d1 text{font-family:'JetBrains Mono','SF Mono','Fira Code',monospace;fill:var(--dg-t1)}
  .d1 .s{fill:var(--dg-t2);font-size:10.5px}.d1 .f{font-size:10.5px}
  .d1 .m{font-size:12.5px}.d1 .t{font-size:13.5px;font-weight:600}
  .d1 .dim{fill:var(--dg-t3);font-size:10px;letter-spacing:.05em}
  .d1 .k{fill:var(--dg-t3);font-size:10px}
  .d1 .tb{fill:var(--dg-tx-blue)}.d1 .tg{fill:var(--dg-tx-green)}.d1 .tp{fill:var(--dg-tx-purple)}
  .d1 .bg{fill:var(--dg-bg)}
  .d1 rect.nn{fill:var(--dg-panel);stroke:var(--dg-stroke)}
  .d1 rect.nb{fill:var(--dg-blue-fill);stroke:#3b82f6}
  .d1 rect.ng{fill:var(--dg-green-fill);stroke:#22c55e}
  .d1 rect.na{fill:var(--dg-amber-fill);stroke:#eab308}
  .d1 rect.np{fill:var(--dg-purple-fill);stroke:#8b5cf6}
</style>
<rect class="bg" width="1120" height="600"/>
<text class="dim" x="32" y="24">DATA MODEL — SQLite holds what the machine observes; files hold what you write by hand</text>

<!-- projects -->
<rect class="nb" x="32" y="44" width="290" height="158" rx="7" stroke-width="1.2"/>
<text class="t" x="46" y="66">projects</text>
<text class="f" x="46" y="88">id · name · icon</text>
<text class="f" x="46" y="106">path</text>
<text class="s" x="132" y="106">canonical workspace dir</text>
<text class="f" x="46" y="124">session</text>
<text class="s" x="132" y="124">tmux session name</text>
<text class="f" x="46" y="142">adopted</text>
<text class="s" x="132" y="142">kept its own name</text>
<text class="f" x="46" y="160">autostart</text>
<text class="s" x="132" y="160">restore on boot</text>
<text class="f" x="46" y="178">last_up_at · last_seen_at</text>
<text class="f" x="46" y="196">archived_at</text>
<text class="s" x="132" y="196">hidden, never deleted</text>

<!-- slots -->
<rect class="nb" x="32" y="242" width="290" height="158" rx="7" stroke-width="1.2"/>
<text class="t" x="46" y="264">slots</text>
<text class="s" x="110" y="264">one window's intent</text>
<text class="f" x="46" y="286">project_id → projects.id</text>
<text class="f" x="46" y="304">ord · window_name · cwd</text>
<text class="f" x="46" y="322">kind</text>
<text class="s" x="132" y="322">shell | agent</text>
<text class="f" x="46" y="340">command</text>
<text class="s" x="132" y="340">shell start line</text>
<text class="f" x="46" y="358">agent</text>
<text class="s" x="132" y="358">agent definition name</text>
<text class="f" x="46" y="376">settled_at</text>
<text class="s" x="132" y="376">lived long enough to keep</text>
<text class="s" x="46" y="394">UNIQUE (project_id, window_name)</text>

<!-- agent definitions (files) -->
<rect class="np" x="32" y="440" width="290" height="126" rx="7" stroke-width="1.2" stroke-dasharray="5 4"/>
<text class="t" x="46" y="462">agent definitions</text>
<text class="s tp" x="212" y="462">FILES</text>
<text class="f" x="46" y="484">~/.config/tmux-mobile/agents/&lt;name&gt;/</text>
<text class="f" x="60" y="502">agent.yaml</text>
<text class="s" x="152" y="502">backend · model · role ·</text>
<text class="s" x="152" y="518">goal · prompt · env · mcp · skills</text>
<text class="f" x="60" y="536">skills/</text>
<text class="s" x="152" y="536">local skill assets</text>
<text class="s tp" x="46" y="556">git-trackable, hand-editable, no second copy in the DB</text>

<line x1="177" y1="202" x2="177" y2="242" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#ab)"/>
<text class="k" x="186" y="228">1 : N</text>
<line x1="177" y1="440" x2="177" y2="400" stroke="#8b5cf6" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ap)"/>
<text class="k" x="186" y="424">by name</text>

<!-- tasks -->
<rect class="ng" x="402" y="44" width="300" height="266" rx="7" stroke-width="1.4"/>
<text class="t" x="416" y="66">tasks</text>
<text class="f" x="416" y="88">id → T-41 · project_id</text>
<text class="f" x="416" y="106">title · brief</text>
<text class="s" x="530" y="106">what the agent is told</text>
<text class="f" x="416" y="124">agent | slot_id</text>
<text class="s" x="530" y="124">who runs it</text>
<text class="f" x="416" y="142">mode</text>
<text class="s" x="530" y="142">window | inject</text>
<text class="f" x="416" y="160">state</text>
<text class="s" x="530" y="160">see lifecycle diagram</text>
<text class="f" x="416" y="178">pane_id · target</text>
<text class="s" x="530" y="178">where to attach</text>
<text class="f" x="416" y="196">agent_session_id</text>
<text class="s" x="530" y="196">from the hook</text>
<text class="f" x="416" y="214">schedule_id</text>
<text class="s" x="530" y="214">null unless cron-born</text>
<text class="f" x="416" y="232">created · dispatched · started</text>
<text class="f" x="416" y="250">last_event_at · finished_at</text>
<text class="f" x="416" y="268">exit_kind</text>
<text class="s" x="530" y="268">done|failed|cancelled</text>
<text class="f" x="416" y="286">log_path</text>
<text class="s" x="530" y="286">archived scrollback</text>
<text class="s tg" x="416" y="304">short-lived by design — this is not an issue tracker</text>

<!-- task_events -->
<rect class="ng" x="402" y="350" width="300" height="122" rx="7" stroke-width="1.2"/>
<text class="t" x="416" y="372">task_events</text>
<text class="s tg" x="530" y="372">append-only</text>
<text class="f" x="416" y="394">task_id → tasks.id · at</text>
<text class="f" x="416" y="412">kind</text>
<text class="s" x="470" y="412">pulse | tool | permission |</text>
<text class="s" x="470" y="428">needs_input | done | failed |</text>
<text class="s" x="470" y="444">state | note</text>
<text class="f" x="416" y="462">summary</text>
<text class="s" x="530" y="462">one line, capped</text>

<line x1="552" y1="310" x2="552" y2="350" stroke="#22c55e" stroke-width="1.2" marker-end="url(#ag)"/>
<text class="k" x="561" y="336">1 : N</text>

<!-- run log file -->
<rect class="nn" x="402" y="504" width="300" height="72" rx="7" stroke-dasharray="5 4"/>
<text class="t" x="416" y="526">run log</text>
<text class="s" x="490" y="526">FILE</text>
<text class="f" x="416" y="546">&lt;project&gt;/.tmm/tasks/T-41.log</text>
<text class="s" x="416" y="564">capture-pane at finish · self-gitignored</text>
<line x1="552" y1="472" x2="552" y2="504" stroke="#22c55e" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ag)"/>

<line x1="322" y1="120" x2="402" y2="120" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#ab)"/>
<text class="k" x="330" y="112">1 : N</text>

<!-- schedules -->
<rect class="na" x="782" y="44" width="306" height="176" rx="7" stroke-width="1.2"/>
<text class="t" x="796" y="66">schedules</text>
<text class="f" x="796" y="88">id · project_id</text>
<text class="f" x="796" y="106">title · brief · agent · mode</text>
<text class="f" x="796" y="124">cron · tz</text>
<text class="s" x="900" y="124">5-field cron</text>
<text class="f" x="796" y="142">action</text>
<text class="s" x="900" y="142">create_task | run_now</text>
<text class="f" x="796" y="160">enabled</text>
<text class="f" x="796" y="178">last_run_at · next_run_at</text>
<text class="f" x="796" y="196">last_status</text>
<text class="s" x="900" y="196">ok | failed | missed</text>
<text class="s" x="796" y="214">a missed window is caught up ONCE, never replayed</text>

<line x1="782" y1="160" x2="702" y2="160" stroke="#eab308" stroke-width="1.2" marker-end="url(#ay)"/>
<text class="k" x="712" y="152">creates</text>

<!-- snapshots -->
<rect class="nn" x="782" y="260" width="306" height="140" rx="7"/>
<text class="t" x="796" y="282">snapshots</text>
<text class="s" x="890" y="282">the history</text>
<text class="f" x="796" y="304">id · project_id · at</text>
<text class="f" x="796" y="322">topology_json</text>
<text class="s" x="796" y="340">windows, cwds, agents as they were</text>
<text class="s" x="796" y="356">at that moment</text>
<text class="s" x="796" y="376">keep the last N per project (default 20) and</text>
<text class="s" x="796" y="392">restore ANY of them — "it broke, roll me back"</text>

<path d="M 322 178 L 352 178 L 352 330 L 782 330" fill="none" stroke="#3b82f6" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ab)"/>
<text class="k" x="726" y="324">on capture diff</text>

<!-- non-goals -->
<rect class="nn" x="782" y="440" width="306" height="136" rx="7"/>
<text class="t" x="796" y="462">what we deliberately do NOT store</text>
<text class="s" x="796" y="484">· priorities, sprints, drag-order, comment trees</text>
<text class="s" x="796" y="502">· a second copy of the agent definitions</text>
<text class="s" x="796" y="520">· raw pane bytes — the pane IS the log</text>
<text class="s" x="796" y="538">· anything Postgres-shaped: one SQLite file, same</text>
<text class="s" x="810" y="554">backup story as config.toml</text>
<text class="s" x="796" y="572">· team.db stays the agora bus, untouched</text>
</svg>
