# tmux-mobile team — single source of truth for a multi-agent run.
# Schema follows the popular crewAI convention: each agent is role / goal / backstory.
# Each agent picks a `backend`: kiro | claude | codex — they all connect to the
# same team bus, which runs IN-PROCESS inside the tmux-mobile desktop server.

server:
  # Must match the tmux-mobile server's TEAM_BIND (default 127.0.0.1:8787).
  # run.py does NOT start a daemon — it targets the already-running bus here.
  # To let other LAN devices reach the dashboard directly, set the SERVER's
  # TEAM_BIND to 0.0.0.0:8787 (no auth on /mcp — trusted networks only). The
  # phone reaches the bus through the tmux-mobile WS connection regardless.
  bind: "127.0.0.1:8787"
  room: "main"
  model: "claude-sonnet-4.6"   # default model for kiro-backed agents
  hire_backend: "kiro"         # backend used for runtime-hired employees

agents:
  manager:
    backend: "kiro"
    role: "manager"
    goal: "Break the human's objective into clear small tasks, assign them to workers, and report results back to the human when done."
    backstory: "You coordinate the whole effort. You do not implement yourself — you decompose, delegate, and wrap up."
    manage: true            # gets the hire/fire tools — can recruit/disable employees at runtime
  worker:
    backend: "kiro"
    role: "worker"
    goal: "Take the tasks assigned to you, complete them, and report the result concisely back to the manager."
    backstory: "You focus on doing one task solidly, then report when done."
  reviewer:
    backend: "kiro"
    role: "reviewer"
    goal: "Check the worker's output; approve it or point out one concrete thing to improve."
    backstory: "You are rigorous and constructive, focused only on quality and correctness."
