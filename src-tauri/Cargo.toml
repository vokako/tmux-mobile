[workspace]
members = ["crates/agora"]

[package]
name = "tmux-mobile"
version = "0.7.0"
edition = "2021"
license = "MIT"
default-run = "tmux-mobile"
# Both binaries are declared explicitly below. Disabling auto-discovery keeps
# macOS AppleDouble files such as `src/bin/._server.rs` from becoming phantom
# bundle targets on filesystems that generate resource-fork sidecars.
autobins = false

[lib]
name = "tmux_mobile"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tmux-mobile"
path = "src/main.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "tmm"
path = "src/bin/tmm.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tokio-rustls = "0.26"
rustls-pemfile = "2"
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = [] }
toml = "1.0.3"
base64 = "0.22"
dirs = "5"
gethostname = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
urlencoding = "2"
hex = "0.4"
flate2 = "1"
socket2 = "0.5"

# agora: the multi-agent group-chat bus. Desktop-only — Android/iOS never run
# the in-process MCP daemon (they connect to a desktop server over WS), so the
# heavy deps (axum/rmcp/rusqlite) are excluded from the mobile build entirely.
# `projects` (state.db) is desktop-only for the same reason: the phone is a
# client of a desktop server, so it never needs SQLite compiled in. Version
# pinned to agora's so both link ONE bundled SQLite.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
agora = { path = "crates/agora" }
rusqlite = { version = "0.32", features = ["bundled"] }

# `npm run tauri:dev:release` and `tauri build` use this profile.
#
# incremental was ON here to shorten edit-rebuild cycles, and it has been turned
# OFF because it stopped working on this crate: every release build after a
# source edit failed at link time with hundreds of
#   Undefined symbols: "_anon.<hash>.<n>.llvm.<n>", referenced from … libtmux_mobile.rlib
#   ld: symbol(s) not found for architecture arm64
# and only `cargo clean -p tmux-mobile --release` (a full ~2 min rebuild of this
# crate) recovered. That is the same cost as building non-incrementally, so
# incremental bought nothing and cost a confusing failure on every edit. The
# trigger is this crate's multi-crate-type output (staticlib + cdylib + rlib):
# LLVM's anonymous per-CGU symbols get renamed between incremental runs while
# the rlib still references the old names.
[profile.release]
incremental = false
