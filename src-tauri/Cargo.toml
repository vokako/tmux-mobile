[package]
name = "tmux-mobile"
version = "0.4.0"
edition = "2021"
default-run = "tmux-mobile"

[lib]
name = "tmux_mobile"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tmux-mobile"
path = "src/main.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tokio-rustls = "0.26"
rustls-pemfile = "2"
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = [] }
toml = "1.0.3"
base64 = "0.22"
dirs = "5"
gethostname = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
urlencoding = "2"
hex = "0.4"
flate2 = "1"

# Used by `npm run tauri:dev:release` and `tauri build`. Keeps full
# optimisation (same opt-level=3 as the default release profile) but turns on
# incremental compilation so edit-rebuild cycles during `tauri:dev:release`
# are ~5-15 s instead of ~30-60 s. Run-time memory and performance are
# indistinguishable from plain release on this codebase. The `.fingerprint`
# metadata costs a few MB of target/release/ disk; harmless.
[profile.release]
incremental = true
