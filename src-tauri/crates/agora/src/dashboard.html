<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
<title>agora · agent bus</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #121722; --panel2: #0e131c; --line: #1e2633;
    --txt: #d7dce5; --dim: #7c879b; --accent: #5cc8ff; --accent2: #9d7cff;
    --task: #ffb454; --reply: #6cd06c; --mention: #ff8f6c; --join: #4a5568; --system: #8a8f99;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: 14px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    background: var(--bg); color: var(--txt);
    height: 100vh; height: 100dvh; height: var(--app-h, 100dvh); overflow: hidden;
  }
  .app {
    display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 48px 1fr auto;
    height: 100vh; height: 100dvh; height: var(--app-h, 100dvh); min-height: 0;
  }
  header {
    grid-column: 1 / 3; display: flex; align-items: center; gap: 14px;
    padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--panel2);
  }
  header .logo { font-weight: 700; letter-spacing: 1px; color: var(--accent); }
  header .logo b { color: var(--accent2); }
  header .state { margin-left: auto; padding: 3px 12px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); }
  .state.done { color: #6cd06c; border-color: #2c5a2c; }
  .state.active { color: var(--accent); border-color: #2a4a5c; }
  .state.deadlock { color: #ff6c6c; border-color: #5a2c2c; }
  .state.empty { color: var(--dim); }
  aside { border-right: 1px solid var(--line); background: var(--panel2); overflow-y: auto; padding: 12px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 4px 0 12px; }
  .agent { padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; background: var(--panel); border: 1px solid var(--line); }
  .agent .nm { display: flex; align-items: center; gap: 7px; font-weight: 600; }
  .agent .role { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--join); flex: none; }
  .dot.online, .dot.working { background: var(--accent); }
  .dot.waiting { background: var(--reply); }
  .dot.offline { background: #3a4150; }
  .st { margin-left: auto; font-size: 11px; color: var(--dim); }
  main { overflow-y: auto; min-height: 0; padding: 16px 20px; }
  .msg { margin-bottom: 12px; max-width: 920px; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  .msg .hd { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
  .msg .from { font-weight: 700; color: var(--accent); }
  .msg .to { color: var(--accent2); }
  .msg .kind { padding: 0 7px; border-radius: 99px; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; border: 1px solid var(--line); color: var(--dim); }
  .msg .kind.task { color: var(--task); border-color: #5a4a2c; }
  .msg .kind.reply { color: var(--reply); border-color: #2c5a2c; }
  .msg .kind.mention, .msg .kind.ask { color: var(--mention); border-color: #5a3c2c; }
  .msg .kind.join, .msg .kind.leave, .msg .kind.system { color: var(--system); }
  .msg .ts { color: var(--dim); font-size: 11px; margin-left: auto; }
  .msg .body { margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .msg.system .body { color: var(--dim); font-style: italic; }
  footer { grid-column: 1 / 3; border-top: 1px solid var(--line); background: var(--panel2); padding: 10px 16px; display: flex; gap: 8px; }
  footer input { background: var(--panel); border: 1px solid var(--line); color: var(--txt); border-radius: 7px; padding: 8px 10px; font: inherit; }
  footer .body { flex: 1; }
  footer button { background: var(--accent); color: #04121c; border: 0; border-radius: 7px; padding: 8px 18px; font: inherit; font-weight: 700; cursor: pointer; }
  footer button:hover { background: #7ad4ff; }
  .hint { color: var(--dim); font-size: 11px; }

  /* --- mobile / narrow screens --- (driven by JS `body.narrow` AND a media query,
     so it works even if a browser uses a wide default layout viewport) --- */
  body.narrow .app, .app.narrowq { grid-template-columns: 1fr; grid-template-rows: 46px auto 1fr auto; }
  @media (max-width: 768px) { .app { grid-template-columns: 1fr; grid-template-rows: 46px auto 1fr auto; } }

  body.narrow header { grid-column: 1; padding: 0 12px; gap: 8px; }
  body.narrow header .logo { font-size: 13px; }
  body.narrow header #room { display: none; }
  body.narrow header .state { font-size: 11px; padding: 2px 8px; }
  /* roster: one thin horizontal strip of compact chips; the dot colour shows status */
  body.narrow aside { grid-column: 1; border-right: 0; border-bottom: 1px solid var(--line);
          display: flex; flex-wrap: nowrap; align-items: center; gap: 6px;
          overflow-x: auto; padding: 5px 8px; -webkit-overflow-scrolling: touch; }
  body.narrow aside h2 { display: none; }
  body.narrow .agent { margin: 0; flex: 0 0 auto; min-width: 0; padding: 3px 9px; }
  body.narrow .agent .nm { font-size: 12px; gap: 5px; }
  body.narrow .agent .role { display: none; }
  body.narrow .agent .st { display: none; }
  body.narrow main { grid-column: 1; padding: 12px 14px; }
  body.narrow .msg { max-width: 100%; }
  body.narrow .msg .body { font-size: 15px; }
  body.narrow footer { grid-column: 1; padding: 8px 10px; gap: 6px; }
  body.narrow footer input { font-size: 16px; }   /* >=16px stops iOS zoom-on-focus */
  body.narrow footer button { padding: 10px 16px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="logo">agora<b>·</b>bus</span>
    <span class="hint" id="room">room: main</span>
    <span class="state empty" id="state">—</span>
  </header>
  <aside>
    <h2>Roster</h2>
    <div id="roster"></div>
  </aside>
  <main id="feed"></main>
  <footer>
    <input class="body" id="body" placeholder="对群里说点什么…   用 @名字 找具体的人（如 @manager 帮我…），不加 @ 就是广播。Enter 发送" />
    <button id="send">发送</button>
  </footer>
</div>
<script>
// Keep the app exactly as tall as the *visible* area. When the on-screen keyboard
// opens, the visual viewport shrinks; we follow it so the input is never covered.
function fitViewport(){
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  document.documentElement.style.setProperty('--app-h', h + 'px');
  // Narrow layout based on the *measured* width (robust to viewport-meta quirks).
  const w = vv ? vv.width : window.innerWidth;
  document.body.classList.toggle('narrow', w <= 820);
  if (typeof feed !== 'undefined' && feed) feed.scrollTop = feed.scrollHeight;
}
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', fitViewport);
  window.visualViewport.addEventListener('scroll', fitViewport);
}
window.addEventListener('resize', fitViewport);
window.addEventListener('orientationchange', fitViewport);

const feed = document.getElementById('feed');
fitViewport();
const seen = new Set();
function ts(ms){ const d=new Date(ms); return d.toLocaleTimeString(); }
function esc(s){ const e=document.createElement('div'); e.textContent=s; return e.innerHTML; }

function render(m){
  if (seen.has(m.id)) return; seen.add(m.id);
  const sys = (m.kind !== 'msg');
  const to = (m.to && m.to.length) ? `<span class="to">→ ${m.to.map(esc).join(', ')}</span>` : '';
  const div = document.createElement('div');
  div.className = 'msg' + (sys?' system':'');
  div.innerHTML = `<div class="hd"><span class="from">${esc(m.from)}</span>${to}`
    + `<span class="ts">${ts(m.ts)}</span></div>`
    + `<div class="body">${esc(m.body)}</div>`;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

const es = new EventSource('/events');
es.addEventListener('message', e => { try { render(JSON.parse(e.data)); } catch(_){} });

async function poll(){
  try {
    const r = await fetch('/api/roster'); const roster = await r.json();
    const box = document.getElementById('roster'); box.innerHTML='';
    for (const a of roster){
      const el = document.createElement('div'); el.className='agent';
      el.innerHTML = `<div class="nm"><span class="dot ${a.status}"></span>${esc(a.name)}<span class="st">${a.status}</span></div>`
        + (a.role?`<div class="role">${esc(a.role)}</div>`:'');
      box.appendChild(el);
    }
    const q = await (await fetch('/api/quiescence')).json();
    const s = document.getElementById('state');
    s.className = 'state ' + q.state;
    s.textContent = q.state==='deadlock' ? `deadlock · ${q.open_items.length} open`
      : q.state==='done' ? 'all idle · done' : q.state;
  } catch(_){}
}
poll(); setInterval(poll, 2000);

function send(){
  const raw = document.getElementById('body').value.trim(); if(!raw) return;
  // Address agents by writing @name in the message (server parses it). An @mention
  // is treated as requiring a reply; plain text is an informational broadcast.
  fetch('/api/post', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ from:'human', body: raw }) });
  document.getElementById('body').value='';
}
document.getElementById('send').onclick = send;
document.getElementById('body').addEventListener('keydown', e => { if(e.key==='Enter') send(); });
</script>
</body>
</html>
